<div class="container py-4 text-dark">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="m-0 text-primary fw-bold"><i class="bi bi-people me-2"></i>Gestión de Usuarios</h2>
    <button class="btn btn-outline-primary btn-sm" (click)="loadUsers()">
      <i class="bi bi-arrow-clockwise"></i> Actualizar
    </button>
  </div>

  @if (isLoading()) {
    <div class="text-center my-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>
  } @else {
    <div class="card bg-white border-platinum shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th class="text-grey-olive small fw-bold">ID</th>
              <th class="fw-bold">Nombre / Email</th>
              <th class="fw-bold">Rol</th>
              <th class="fw-bold">Estado</th>
              <th class="text-end fw-bold">Acciones</th>
            </tr>
          </thead>
          <tbody>
            @for (user of users(); track user.id) {
              <tr [class.opacity-50]="user.deleted">
                <td class="text-muted small"><code>{{ user.id }}</code></td>
                <td>
                  <div class="fw-bold text-dark">{{ user.name || 'Sin Nombre' }}</div>
                  <div class="small text-grey-olive">{{ user.email }}</div>
                </td>
                <td>
                  <select 
                    class="form-select form-select-sm bg-white text-dark border-platinum w-auto shadow-none" 
                    [value]="user.role"
                    (change)="updateRole(user.id, roleSelect.value)"
                    #roleSelect
                    [disabled]="user.deleted">
                    <option value="guest">Guest</option>
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                  </select>
                </td>
                <td>
                  @if (user.deleted) {
                    <span class="badge bg-danger text-white">Suspendido</span>
                  } @else {
                    <span class="badge bg-success text-white">Activo</span>
                  }
                </td>
                <td class="text-end">
                  <button 
                    class="btn btn-sm shadow-none" 
                    [class.text-danger]="!user.deleted"
                    [class.text-warning]="user.deleted"
                    (click)="requestToggleDelete(user)"
                    [title]="user.deleted ? 'Restaurar' : 'Eliminar'">
                    <i class="bi" [class.bi-trash]="!user.deleted" [class.bi-arrow-counterclockwise]="user.deleted"></i>
                  </button>
                </td>
              </tr>
            } @empty {
              <tr>
                <td colspan="5" class="text-center py-4 text-grey-olive">
                  No hay usuarios registrados
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  }

  <app-confirm-modal 
    [isOpen]="isModalOpen()"
    [title]="targetUser()?.deleted ? 'Restaurar Usuario' : 'Suspender Usuario'"
    [message]="targetUser()?.deleted ? '¿Deseas restaurar el acceso de este usuario?' : '¿Estás seguro de que deseas suspender a este usuario? No podrá realizar acciones en la plataforma.'"
    [confirmText]="targetUser()?.deleted ? 'Restaurar' : 'Suspender'"
    [confirmClass]="targetUser()?.deleted ? 'btn-warning' : 'btn-danger'"
    (confirmed)="confirmToggleDelete()"
    (cancelled)="closeModal()">
  </app-confirm-modal>
</div>
