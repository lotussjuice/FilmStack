<div class="modal-overlay d-flex align-items-center justify-content-center" (click)="cancel.emit()">
  <div class="modal-container rounded-4 shadow-lg p-4" style="max-width: 450px;" (click)="$event.stopPropagation()">
    <div class="text-center">
      <i class="bi bi-exclamation-triangle-fill text-status-yellow fs-1 mb-2 d-block"></i>
      <p class="text-onyx mb-3" [innerHTML]="message()"></p>
      <div class="d-flex gap-2 justify-content-center">
        <button class="btn btn-light border-dry-sage" (click)="cancel.emit()">Cancelar</button>
        <button class="btn btn-danger" (click)="confirm.emit()">
          <i class="bi bi-trash me-1"></i>Eliminar
        </button>
      </div>
    </div>
  </div>
</div>
