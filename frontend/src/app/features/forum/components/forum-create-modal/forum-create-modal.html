<div class="modal-overlay d-flex align-items-center justify-content-center" (click)="onClose()">
  <div class="modal-container rounded-4 shadow-lg p-4" (click)="$event.stopPropagation()">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="m-0 fw-bold text-onyx">
        <i class="bi bi-plus-circle me-2"></i>Nuevo Post
      </h5>
      <button type="button" class="btn-close" (click)="onClose()"></button>
    </div>

    <div class="mb-3">
      <label class="form-label small fw-bold text-dry-sage">T&iacute;tulo</label>
      <input class="form-control" [(ngModel)]="title" placeholder="Titulo del post" maxlength="500" />
    </div>

    <div class="mb-3">
      <label class="form-label small fw-bold text-dry-sage">Contenido</label>
      <textarea class="form-control" rows="6" [(ngModel)]="content" placeholder="Escribe tu post..."></textarea>
    </div>

    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" id="createIsPublic" [(ngModel)]="isPublic" />
      <label class="form-check-label" for="createIsPublic">P&uacute;blico</label>
      <span class="d-block small text-dry-sage">
        <i class="bi" [class.bi-globe]="isPublic()" [class.bi-lock]="!isPublic()"></i>
        {{ isPublic() ? 'Visible para todos' : 'Solo visible para tus amigos' }}
      </span>
    </div>

    <div class="d-flex gap-2 justify-content-end">
      <button class="btn btn-light border-dry-sage" (click)="onClose()">Cancelar</button>
      <button class="btn btn-primary" [disabled]="!title().trim() || !content().trim() || submitting()"
        (click)="submit()">
        @if (submitting()) {
          <span class="spinner-border spinner-border-sm me-1"></span>
        }
        Publicar
      </button>
    </div>
  </div>
</div>
