@if (isOpen()) {
  <div class="modal-overlay d-flex align-items-center justify-content-center">
    <div class="modal-container rounded-4 shadow-lg p-4 animate__animated animate__fadeInUp">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="m-0 fw-bold text-dark-green">Anadir a Backlog</h4>
        <button class="btn-close" (click)="onCancel()"></button>
      </div>

      <div class="movie-mini-info d-flex gap-3 mb-4 p-3 bg-dry-sage rounded-3">
        @if (movie().poster_path) {
          <img [src]="'https://image.tmdb.org/t/p/w200' + movie().poster_path" class="rounded-2 shadow-sm" style="width: 60px; height: 90px; object-fit: cover;">
        }
        <div>
          <h6 class="m-0 fw-bold text-onyx">{{ movie().title }}</h6>
          <p class="small text-onyx m-0">{{ movie().release_date | date:'y' }}</p>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold text-dry-sage">Cual es el estado?</label>
        <div class="d-flex gap-2">
          <button type="button" class="btn flex-grow-1"
            [class.btn-primary]="status() === 'pending'"
            [class.btn-outline-primary]="status() !== 'pending'"
            (click)="status.set('pending')">
            <i class="bi bi-clock"></i> Pendiente
          </button>
          <button type="button" class="btn flex-grow-1"
            [class.btn-success]="status() === 'watched'"
            [class.btn-outline-success]="status() !== 'watched'"
            (click)="status.set('watched')">
            <i class="bi bi-check-circle"></i> Vista
          </button>
          <button type="button" class="btn flex-grow-1"
            [class.btn-danger]="status() === 'dropped'"
            [class.btn-outline-danger]="status() !== 'dropped'"
            (click)="status.set('dropped')">
            <i class="bi bi-x-circle"></i> Abandonada
          </button>
        </div>
      </div>

      @if (status() === 'watched' || status() === 'dropped') {
        <div class="animate__animated animate__fadeIn">
          <div class="mb-3">
            <label class="form-label fw-semibold text-dry-sage">Tu Nota</label>
            <div class="rating-stars d-flex gap-1 fs-3">
              @for (star of [1,2,3,4,5]; track star) {
                <i class="bi"
                  [class.bi-star-fill]="rating() >= star"
                  [class.bi-star]="rating() < star"
                  [class.text-status-yellow]="rating() >= star"
                  [class.text-muted]="rating() < star"
                  (click)="setRating(star)"
                  style="cursor: pointer;">
                </i>
              }
            </div>
            @if (ratingError()) {
              <div class="text-danger small mt-1">
                <i class="bi bi-exclamation-circle me-1"></i>{{ ratingError() }}
              </div>
            }
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold text-dry-sage">Tu Resena</label>
            <textarea class="form-control border-dry-sage" rows="3"
              placeholder="Escribe lo que te parecio..."
              [(ngModel)]="review">
            </textarea>
          </div>
        </div>
      }

      <div class="mb-4 d-flex align-items-center gap-2">
        <div class="form-check form-switch fs-5">
          <input class="form-check-input" type="checkbox" id="favSwitch" [(ngModel)]="isFavorite">
          <label class="form-check-label small fw-semibold text-dry-sage" for="favSwitch">
            <i class="bi" [class.bi-star-fill]="isFavorite()" [class.text-status-yellow]="isFavorite()"></i>
            Marcar como favorita
          </label>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-light flex-grow-1 text-onyx" (click)="onCancel()">Cancelar</button>
        <button class="btn btn-primary flex-grow-1" (click)="onSave()">Guardar en Backlog</button>
      </div>
    </div>
  </div>
}
