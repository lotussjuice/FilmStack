@if (isActive() && session(); as s) {
  <div class="session-banner d-flex align-items-center gap-3 p-3 rounded-3 shadow-sm">
    <div class="session-icon">
      <i class="bi bi-eye-fill"></i>
    </div>
    @if (posterUrl(); as url) {
      <img [src]="url" alt="" class="session-thumb">
    }
    <div class="flex-grow-1 min-w-0">
      <div class="small text-dry-sage text-uppercase fw-bold mb-1">
        Viendo ahora
      </div>
      <div class="marquee-container">
        <div class="fw-bold text-onyx marquee-text">{{ s.title }}</div>
      </div>
    </div>
    <div class="d-flex gap-2 flex-shrink-0">
      <button type="button" class="btn btn-success fw-bold" (click)="onFinish()">
        <i class="bi bi-check2-circle me-1"></i> Finalizar
      </button>
      <button type="button" class="btn btn-outline-secondary" (click)="onDiscard()" title="Cancelar sesion">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>
}
