@if (isOpen() && movie()) {
  <div class="modal-overlay d-flex align-items-center justify-content-center">
    <div class="modal-container rounded-4 shadow-lg p-4 animate__animated animate__zoomIn">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="m-0 text-dark-green">Tu eleccion es...</h3>
        <button class="btn-close" (click)="onDismiss()"></button>
      </div>

      <div class="row g-4 align-items-center">
        <div class="col-12 col-md-5 text-center">
          @if (posterUrl(); as url) {
            <img [src]="url" alt="Poster" class="result-poster rounded-3 shadow">
          } @else {
            <div class="result-poster-placeholder rounded-3 d-flex align-items-center justify-content-center">
              <i class="bi bi-film fs-1 text-onyx"></i>
            </div>
          }
        </div>
        <div class="col-12 col-md-7">
          <h2 class="text-dark-green fw-bold mb-2">{{ movie()!.tmdb_data?.title }}</h2>
          <div class="d-flex gap-2 align-items-center mb-3">
            @if (year()) {
              <span class="badge bg-dry-sage text-onyx">{{ year() }}</span>
            }
            @if (rating() > 0) {
              <span class="badge bg-status-yellow text-onyx">
                <i class="bi bi-star-fill me-1"></i>{{ rating() | number:'1.1-1' }}
              </span>
            }
          </div>
          @if (movie()!.tmdb_data?.overview) {
            <p class="text-onyx small mb-0" style="max-height: 140px; overflow-y: auto;">
              {{ movie()!.tmdb_data?.overview }}
            </p>
          }
        </div>
      </div>

      <div class="d-flex gap-2 mt-4">
        <button type="button" class="btn btn-light flex-grow-1 text-onyx" (click)="onDismiss()">
          <i class="bi bi-x-lg me-1"></i> Descartar
        </button>
        <button type="button" class="btn btn-primary flex-grow-1" (click)="onAccept()">
          <i class="bi bi-check-lg me-1"></i> Aceptar y ver
        </button>
      </div>
    </div>
  </div>
}
