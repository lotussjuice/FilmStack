@if (isOpen()) {
  <div class="modal-backdrop fade show"></div>
  <div class="modal d-block fade show" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content bg-dark text-light border-secondary shadow-lg">
        <div class="modal-header border-secondary">
          <h5 class="modal-title">{{ title() }}</h5>
          <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="onCancel()"></button>
        </div>
        <div class="modal-body">
          <p>{{ message() }}</p>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">{{ cancelText() }}</button>
          <button type="button" class="btn" [class]="confirmClass()" (click)="onConfirm()">{{ confirmText() }}</button>
        </div>
      </div>
    </div>
  </div>
}
