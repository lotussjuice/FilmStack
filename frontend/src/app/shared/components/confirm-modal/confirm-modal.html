@if (isOpen()) {
  <div class="modal-overlay d-flex align-items-center justify-content-center">
    <div class="modal-container rounded-4 shadow-lg p-4 animate__animated animate__fadeInUp">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="m-0 fw-bold text-dark-green">{{ title() }}</h4>
        <button type="button" class="btn-close" aria-label="Close" (click)="onCancel()"></button>
      </div>
      <div class="mb-4">
        <p class="text-onyx">{{ message() }}</p>
      </div>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-light flex-grow-1 text-onyx" (click)="onCancel()">{{ cancelText() }}</button>
        <button type="button" class="btn flex-grow-1" [class]="confirmClass()" (click)="onConfirm()">{{ confirmText() }}</button>
      </div>
    </div>
  </div>
}
